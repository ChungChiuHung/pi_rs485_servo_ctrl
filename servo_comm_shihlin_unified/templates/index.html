<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Servo Control</title>
        <link rel="stylesheet" href='../static/style.css'/>
        <!--
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        -->
        <script src="../static/js/jquery-3.5.1.min.js"></script>
        <script>
            $(document).ready(function(){
                function clearStatuses(excludeAction){
                    let actions = ['servoOn','servoOff','getMsg','getIOOutput','setPoint_1','setPoint_2','Home','motionStart','motionPause','motionCancel'];
                    actions.forEach(function(action){
                        if(action !== excludeAction){
                            $('#'+action+'_status').text('');
                        }
                    });
                }
                

                function timestamp() {
                    return new Date().toLocaleTimeString();
                }

                function setFeedback(action, text, ok) {
                    $('#' + action + '_status')
                        .text('[' + timestamp() + '] ' + text)
                        .removeClass('status-ok status-error')
                        .addClass('action-feedback')
                        .addClass(ok ? 'status-ok' : 'status-error');
                }

                // The backend only ever runs one hardware-touching request
                // at a time (see app.py's hardware_serialized decorator) --
                // disabling every command button while any request is in
                // flight matches that constraint and stops a fast
                // double-click from firing a second command before the
                // first one's multi-step sequence has finished (a real risk
                // found via real-hardware timing tests: the driver itself
                // handles rapid requests fine, but overlapping commands
                // from this app could still interleave or flip a
                // toggle-like action, like start_continuous_reading(),
                // back off before its first click's effect took hold).
                function setButtonsEnabled(enabled) {
                    $('.button[data-action]').prop('disabled', !enabled);
                    $('#clearAlarm12Btn').prop('disabled', !enabled);
                }

                function sendCommand(action) {
                    clearStatuses(action);
                    setButtonsEnabled(false);
                    $.ajax({
                        url:'/action',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({action: action}),
                        success: function(response){
                            console.log('Success:',response);
                            setFeedback(action, response.message || 'Action Completed', true);
                            // Update RS485 status values in the UI
                            $('#rs485_send').val(response.RS485_send);
                            $('#RS485_receive').val(response.RS485_read);
                        },
                        error: function(xhr){
                            console.error('Error:', xhr);
                            const msg = (xhr.responseJSON && xhr.responseJSON.message) || 'Error performing action';
                            setFeedback(action, msg, false);
                        }
                    }).always(function(){
                        setButtonsEnabled(true);
                    });
                }

                // Bind sendCommand function to buttons (Clear Alarm 12 is
                // handled separately below -- it needs a confirm dialog and
                // goes through /alarm/clear, not the plain /action path).
                $('.button[data-action]').click(function(){
                    const action = $(this).attr('data-action');
                    sendCommand(action);
                });

                // Alarm 12 clear -- routes through /alarm/clear (confirm +
                // before/after verification), not the bare clearAlarm12
                // /action, since clearing it can mask a physical E-Stop
                // condition (see README "Alarm 12 clear -- safety
                // precondition").
                $('#clearAlarm12Btn').click(function(){
                    const confirmed = window.confirm(
                        'Clear Alarm 12 (Emergency Stop)?\n\n' +
                        'Only do this after confirming the physical E-Stop ' +
                        'condition has actually been resolved -- this can ' +
                        'make the drive treat EMG as released even if a ' +
                        'physical E-Stop circuit is still engaged.'
                    );
                    if (!confirmed) {
                        return;
                    }
                    setFeedback('clearAlarm12', 'Clearing...', true);
                    setButtonsEnabled(false);
                    $.ajax({
                        url: '/alarm/clear',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({confirm: true}),
                        success: function(response){
                            setFeedback(
                                'clearAlarm12',
                                'before=' + response.before_alarm_code +
                                    ' after=' + response.after_alarm_code +
                                    ' (' + response.mechanism_used + ')',
                                response.status === 'success'
                            );
                        },
                        error: function(xhr){
                            const msg = (xhr.responseJSON && xhr.responseJSON.message) || 'Failed to clear alarm';
                            setFeedback('clearAlarm12', msg, false);
                        }
                    }).always(function(){
                        setButtonsEnabled(true);
                    });
                });

                // Motor profile selection
                function loadProfile() {
                    $.get('/profile', function(response) {
                        $('#profile_select').empty();
                        response.available_profiles.forEach(function(name) {
                            $('#profile_select').append(
                                $('<option>').val(name).text(name)
                            );
                        });
                        $('#profile_select').val(response.active_profile);
                        $('#profile_status').text('Active: ' + response.active_profile);
                    }).fail(function() {
                        $('#profile_status').text('Could not load profile list.');
                    });
                }

                $('#profile_select').change(function() {
                    const selected = $(this).val();
                    $('#profile_status').text('Switching to ' + selected + '...');
                    $.ajax({
                        url: '/profile',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({profile: selected}),
                        success: function(response) {
                            $('#profile_status').text('Active: ' + response.active_profile);
                        },
                        error: function(xhr) {
                            const msg = (xhr.responseJSON && xhr.responseJSON.message) || 'Failed to switch profile';
                            $('#profile_status').text('Error: ' + msg);
                            loadProfile(); // revert dropdown to the actual active profile
                        }
                    });
                });

                loadProfile();

                // Continuous-motion input server (OSC / Art-Net) control.
                // Starting/stopping itself never sends anything to the
                // driver (see app.py's /server/start docstring) -- real
                // hardware I/O only happens later, if and when a message
                // actually arrives on whichever protocol is running.
                function updateInputServerFieldsVisibility() {
                    const type = $('#input_server_type').val();
                    $('.osc-only').toggle(type === 'osc');
                    $('.artnet-only').toggle(type === 'artnet');
                }

                $('#input_server_type').change(updateInputServerFieldsVisibility);
                updateInputServerFieldsVisibility();

                function pollInputServerStatus() {
                    $.get('/server/status', function(response) {
                        const label = response.active_input_server
                            ? response.active_input_server.toUpperCase() + (response.is_running ? ' (running)' : ' (starting...)')
                            : 'None';
                        $('#input_server_status_label').text(label);
                        $('#startInputServerBtn').prop('disabled', !!response.active_input_server);
                        $('#stopInputServerBtn').prop('disabled', !response.active_input_server);
                    });
                }

                $('#startInputServerBtn').click(function(){
                    const type = $('#input_server_type').val();
                    const payload = {type: type};
                    if (type === 'osc') {
                        payload.listen_port = parseInt($('#osc_listen_port').val(), 10) || 5005;
                    } else {
                        payload.listen_port = parseInt($('#artnet_listen_port').val(), 10) || 6454;
                        payload.universe = parseInt($('#artnet_universe').val(), 10) || 0;
                    }
                    $('#input_server_action_status').text('Starting ' + type + '...');
                    $.ajax({
                        url: '/server/start',
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(payload),
                        success: function(response) {
                            $('#input_server_action_status').text(
                                'Started ' + response.active_input_server + ' on port ' + response.listen_port
                            );
                            pollInputServerStatus();
                        },
                        error: function(xhr) {
                            const msg = (xhr.responseJSON && xhr.responseJSON.message) || 'Failed to start server';
                            $('#input_server_action_status').text('Error: ' + msg);
                        }
                    });
                });

                $('#stopInputServerBtn').click(function(){
                    $('#input_server_action_status').text('Stopping...');
                    $.ajax({
                        url: '/server/stop',
                        type: 'POST',
                        success: function(response) {
                            $('#input_server_action_status').text('Stopped ' + response.stopped);
                            pollInputServerStatus();
                        },
                        error: function(xhr) {
                            const msg = (xhr.responseJSON && xhr.responseJSON.message) || 'Failed to stop server';
                            $('#input_server_action_status').text('Error: ' + msg);
                        }
                    });
                });

                pollInputServerStatus();
                setInterval(pollInputServerStatus, 2000);

                // Live status panel -- read-only, polled on an interval.
                // Never sends a write/motion command; see GET /status.
                function pollStatus() {
                    $.get('/status', function(response) {
                        $('#status_connected_port').text(response.connected_port);
                        $('#status_baud_rate').text(response.baud_rate);
                        $('#status_reading_active').text(response.reading_active ? 'Yes' : 'No');
                        $('#status_current_angle').text(response.current_angle.toFixed(4) + ' deg');
                        $('#status_current_encoder').text(response.current_encoder);

                        // servo_on is read fresh from the drive (0x0200
                        // bit0), not inferred -- null means "communication
                        // failure, unknown", never treated as "off".
                        const servoOnTile = $('#status_servo_on_tile');
                        if (response.servo_on === null) {
                            $('#status_servo_on').text('unknown');
                            servoOnTile.addClass('alarm-active');
                        } else if (response.servo_on) {
                            $('#status_servo_on').text('Yes');
                            servoOnTile.removeClass('alarm-active');
                        } else {
                            $('#status_servo_on').text('No');
                            servoOnTile.removeClass('alarm-active');
                        }

                        // Use the backend's alarm_active flag, not a raw
                        // alarm_code != 0 check -- this driver reports 0xFF
                        // (255), not 0, for "no alarm" (confirmed against
                        // the physical panel, which shows "AL --" at that
                        // value). See servo_control.NO_ALARM_CODES.
                        const alarmTile = $('#status_alarm_tile');
                        if (response.alarm_code === null) {
                            $('#status_alarm_code').text('unknown');
                            alarmTile.addClass('alarm-active');
                        } else if (!response.alarm_active) {
                            $('#status_alarm_code').text(response.alarm_code + ' (none)');
                            alarmTile.removeClass('alarm-active');
                        } else {
                            $('#status_alarm_code').text(response.alarm_code);
                            alarmTile.addClass('alarm-active');
                        }
                        $('.status-tile').removeClass('disconnected');
                    }).fail(function() {
                        $('.status-tile').addClass('disconnected');
                    });
                }

                pollStatus();
                setInterval(pollStatus, 2000);
            });
        </script>
    </head>
    <body>
        <div class="navbar">
            <a href="/">Home</a>
            <a href="/index">Config</a>
        </div>
        <main>
            <section class="live-status">
                <h2>Live Status</h2>
                <div class="status-grid">
                    <div class="status-tile">
                        <span class="label">Port</span>
                        <span class="value" id="status_connected_port">-</span>
                    </div>
                    <div class="status-tile">
                        <span class="label">Baud</span>
                        <span class="value" id="status_baud_rate">-</span>
                    </div>
                    <div class="status-tile" id="status_alarm_tile">
                        <span class="label">Alarm Code</span>
                        <span class="value" id="status_alarm_code">-</span>
                    </div>
                    <div class="status-tile" id="status_servo_on_tile">
                        <span class="label">Servo ON</span>
                        <span class="value" id="status_servo_on">-</span>
                    </div>
                    <div class="status-tile">
                        <span class="label">Continuous Reading</span>
                        <span class="value" id="status_reading_active">-</span>
                    </div>
                    <div class="status-tile">
                        <span class="label">Current Angle</span>
                        <span class="value" id="status_current_angle">-</span>
                    </div>
                    <div class="status-tile">
                        <span class="label">Current Encoder</span>
                        <span class="value" id="status_current_encoder">-</span>
                    </div>
                </div>
            </section>
            <section class="motor-profile">
                <h2>Motor Profile</h2>
                <div class="form-group">
                    <label for="profile_select">Active motor:</label>
                    <select id="profile_select"></select>
                    <span id="profile_status"></span>
                </div>
            </section>
            <section class="input-server">
                <h2>Continuous Motion Input</h2>
                <div class="form-group">
                    <label for="input_server_type">Protocol:</label>
                    <select id="input_server_type">
                        <option value="osc">OSC</option>
                        <option value="artnet">Art-Net</option>
                    </select>
                </div>
                <div class="form-group osc-only">
                    <label for="osc_listen_port">OSC listen port:</label>
                    <input type="number" id="osc_listen_port" value="5005">
                </div>
                <div class="form-group artnet-only">
                    <label for="artnet_listen_port">Art-Net listen port:</label>
                    <input type="number" id="artnet_listen_port" value="6454">
                </div>
                <div class="form-group artnet-only">
                    <label for="artnet_universe">Art-Net universe:</label>
                    <input type="number" id="artnet_universe" value="0">
                </div>
                <div class="button-container">
                    <button class="button" id="startInputServerBtn">Start</button>
                    <button class="button" id="stopInputServerBtn">Stop</button>
                </div>
                <p>Active: <span id="input_server_status_label">-</span></p>
                <span id="input_server_action_status"></span>
            </section>
            <section class="Servo Amplifier Controller(RS485)">
                <div class="rs485">
                    <h1>RS485 R/W Status</h1>
                    <div class="form-group">
                        <label for="rs485_send">RS-485 Send:</label>
                        <input type="text" id="rs485_send" value="{{ RS485_send }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="rs485_receive">RS-485 Receive:</label>
                        <input type="text" id="rs485_receive" value="{{ RS485_read }}" readonly>
                    </div>
                </div>
                <div class="commands">
                    <h2>Commands</h2>
                    <div class="button-container"><button class="button" data-action="servoOn">SERVO ON</button><span id="servoOn_status"></span></div>
                    <div class="button-container"><button class="button" data-action="servoOff">SERVO OFF</button><span id="servoOff_status"></span></div>
                    <div class="button-container"><button class="button" data-action="getMsg">GET STATE VALUE</button><span id="getMsg_status"></span></div>
                    <div class="button-container"><button class="button" id="clearAlarm12Btn">CLEAR ALARM 12</button><span id="clearAlarm12_status"></span></div>
                    <div class="button-container"><button class="button" data-action="enablePosMode">ENABLE POS MODE</button><span id="enablePosMode_status"></span></div>
                    <div class="button-container"><button class="button" data-action="posTestStart_CW">POS TEST START CW</button><span id="posTest_status_CW"></span></div>
                    <div class="button-container"><button class="button" data-action="posTestStart_CCW">POS TEST START CCW</button><span id="posTest_status_CCW"></span></div>
                    <div class="button-container"><button class="button" data-action="setPoint_1">SET POINT 1</button><span id="setPoint_1_status"></span></div>
                    <div class="button-container"><button class="button" data-action="setPoint_2">SET POINT 2</button><span id="setPoint_2_status"></span></div>
                    <div class="button-container"><button class="button" data-action="Home">HOME</button><span id="Home_status"></span></div>
                    <div class="button-container"><button class="button" data-action="enableSpeedCtrlMode">ENABLE SPEED CONTROL MODE</button><span id="enableSpeedCtrlMode_status"></span></div>
                    <div class="button-container"><button class="button" data-action="motionStart_CW">MOTION START CW</button><span id="motionStart_CW_status"></span></div>
                    <div class="button-container"><button class="button" data-action="motionStart_CCW">MOTION START CCW</button><span id="motionStart_CCW_status"></span></div>
                    <div class="button-container"><button class="button" data-action="motionPause">MOTION PAUSE</button><span id="motionPause_status"></span></div>
                    <div class="button-container"><button class="button" data-action="motionCancel">MOTION CANCEL</button><span id="motionCancel_status"></span></div>
                </div>
            </section>
            <a href="/">Go Back to Home</a>
        </main>
    </body>
</html>
